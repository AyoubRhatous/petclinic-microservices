---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: petclinic-frontend
  labels:
    account: petclinic-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-frontend
  labels:
    app: petclinic-frontend
spec:
  ports:
  - name: http
    port: 8080
  selector:
    app: petclinic-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-frontend-v1
  labels:
    app: petclinic-frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic-frontend
      version: v1
  template:
    metadata:
      labels:
        app: petclinic-frontend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: petclinic-frontend
      
      # Init container to download OpenTelemetry Java agent
      initContainers:
      - name: otel-agent-download
        image: busybox:latest
        command:
        - wget
        - "-O"
        - "/otel-javaagent/opentelemetry-javaagent.jar"
        - "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar"
        volumeMounts:
        - name: otel-javaagent
          mountPath: /otel-javaagent
      
      containers:
      - name: petclinic-frontend
        image: testrhhh/petclinic-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        
        # OpenTelemetry environment variables for tracing
        env:
        # Java agent configuration
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/otel-javaagent/opentelemetry-javaagent.jar"
        
        # OpenTelemetry core configuration
        - name: OTEL_SERVICE_NAME
          value: "petclinic-frontend"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger-collector.istio-system.svc.cluster.local:4318"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        
        # Optional: Enable HTTP client instrumentation for outgoing calls
        - name: OTEL_INSTRUMENTATION_HTTP_CLIENT_ENABLED
          value: "true"
        
        # Volume mount for the Java agent
        volumeMounts:
        - name: otel-javaagent
          mountPath: /otel-javaagent
        
        livenessProbe:
          httpGet:
            port: 8080
            path: /actuator/health/liveness
          initialDelaySeconds: 90
          periodSeconds: 5
        readinessProbe:
          httpGet:
            port: 8080
            path: /actuator/health/readiness
          initialDelaySeconds: 15
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 1Gi
      
      # Volume to share the Java agent between initContainer and main container
      volumes:
      - name: otel-javaagent
        emptyDir: {}
